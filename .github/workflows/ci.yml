name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: python -m pytest -q --tb=short
      - name: Engine self-test
        run: python -c "from hermes_harbor.engine import self_test; r=self_test(); assert r['success'], r"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify packaged data
        run: |
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
          required = [
              "hermes_harbor/plugin.yaml",
              "hermes_harbor/data/thresholds.yaml",
              "hermes_harbor/skill/SKILL.md",
          ]
          missing = [p for p in required if p not in names]
          assert not missing, f"missing package data: {missing}"
          print("package data ok:", required)
          PY
